name: vsworker

on:
  push:
    branches: [vsworker]
  pull_request:
    branches: [vsworker]

concurrency:
  group: vsworker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # A dropped seam ships a build with part of the bundle missing and breaks nothing else, so check it first.
      - name: Check upstream seams
        run: bun run --cwd vsworker bundle check --seams

      - name: Check the generated bundle is current
        run: bun run --cwd vsworker bundle check

      - name: Typecheck
        run: bun run --cwd vsworker typecheck

      - name: Test the bundle logic
        run: bun test
        working-directory: vsworker

      - name: Test bundling inside the host
        run: bun test test/vsworker
        working-directory: packages/opencode

      # Proves the bundle actually reaches a shipped artifact, not just the dev server.
      - name: Build the CLI binary
        run: bun run script/build.ts --single --skip-install --skip-embed-web-ui
        working-directory: packages/opencode

      - name: Smoke test the bundle in the binary
        run: |
          set -euo pipefail
          BIN=./dist/opencode-linux-x64/bin/opencode
          "$BIN" vsworker plugins list
          "$BIN" vsworker mcp list
          "$BIN" vsworker skills list
          # Enabling a skill has to write the cache directory, which is the half that only exists at runtime.
          "$BIN" vsworker skills enable hello -g
          "$BIN" vsworker skills list
          test -f "${XDG_CACHE_HOME:-$HOME/.cache}/vsworker/vsworker/skills/hello/SKILL.md"
        working-directory: packages/opencode
